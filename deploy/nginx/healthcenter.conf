# /etc/nginx/sites-available/healthcenter  (symlink into sites-enabled)
# TLS via certbot:  certbot --nginx -d example.com
upstream healthcenter_app { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Uploads: 15 MB per file, up to several files per request (app enforces per-file limit).
    client_max_body_size 64m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Static frontend served directly by Nginx. Uploaded files are NEVER served from here:
    # they live in STORAGE_ROOT outside this root and only flow through authenticated API endpoints.
    root /opt/healthcenter/app/web;
    index index.html;

    location /api/ {
        proxy_pass http://healthcenter_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_buffering on;
    }

    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(js|css|png|svg|ico|woff2|json)$ { expires 1h; add_header Cache-Control "public"; try_files $uri =404; }
    # SPA fallback (hash routing, but keep deep links working)
    location / { try_files $uri /index.html; }
    access_log /var/log/nginx/healthcenter.access.log;
}
