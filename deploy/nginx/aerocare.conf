# /etc/nginx/sites-available/aerocare  (symlink into sites-enabled)
# Replace every "example.com" with your domain. Get the certificate FIRST (docs/DEPLOYMENT.md §7):
# this file references /etc/letsencrypt/live/<domain>/ and `nginx -t` fails until those files exist.
# Also install deploy/nginx/aerocare-headers.conf as /etc/nginx/snippets/aerocare-headers.conf.
upstream aerocare_app { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    # certbot renewals (webroot) + redirect everything else to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;

    # Uploads: 15 MB per file, up to several files per request (app enforces per-file limit).
    client_max_body_size 64m;
    client_body_timeout 60s;

    # Security headers for the static frontend (the API adds its own). Nginx drops server-level
    # add_header lines inside any location that has its own add_header, so every location includes them.
    include /etc/nginx/snippets/aerocare-headers.conf;

    # Static frontend served directly by Nginx. Uploaded files are NEVER served from here:
    # they live in STORAGE_ROOT outside this root and only flow through authenticated API endpoints.
    root /opt/aerocare/app/web;
    index index.html;

    location /api/ {
        proxy_pass http://aerocare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    location = /sw.js {
        include /etc/nginx/snippets/aerocare-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|svg|ico|woff2|json)$ {
        include /etc/nginx/snippets/aerocare-headers.conf;
        add_header Cache-Control "no-cache" always;   # revalidate so upgrades reach every browser
        try_files $uri =404;
    }
    # SPA fallback (hash routing, but keep deep links working)
    location / { try_files $uri /index.html; }
    access_log /var/log/nginx/aerocare.access.log;
}
